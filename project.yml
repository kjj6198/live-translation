name: LiveTranslation
options:
  bundleIdPrefix: dev.kalan
  deploymentTarget:
    macOS: "26.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  LiveTranslation:
    type: application
    platform: macOS
    sources: [LiveTranslation]
    info:
      path: LiveTranslation/Info.plist
      properties:
        CFBundleDisplayName: Live Translation
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Listens to speech so it can be translated between English and Japanese on this Mac.
    entitlements:
      path: LiveTranslation/LiveTranslation.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
